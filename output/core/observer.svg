y="379.8457">+onEvent(event: SystemEvent): void</text></g><!--class EventBus--><g id="elem_EventBus"><rect codeLine="22" fill="#F1F1F1" height="161.8438" id="EventBus" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="467" x="572.5" y="81.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="66" x="773" y="99.0664">&#171;Singleton&#187;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="56" x="778" y="114.1602">&#171;Subject&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="60" x="776" y="131.3301">EventBus</text><line style="stroke:#181818;stroke-width:0.5;" x1="573.5" x2="1038.5" y1="139.4063" y2="139.4063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="126" x="578.5" y="157.9395">-instance: EventBus</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="394" x="578.5" y="175.5488">-subscribers: Map&lt;SystemEventType, List&lt;SystemObserver&gt;&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="573.5" x2="1038.5" y1="182.625" y2="182.625"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="439" x="578.5" y="201.1582">+subscribe(type: SystemEventType, observer: SystemObserver): void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="455" x="578.5" y="218.7676">+unsubscribe(type: SystemEventType, observer: SystemObserver): void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="222" x="578.5" y="236.377">+publish(event: SystemEvent): void</text></g><!--class SystemEvent--><g id="elem_SystemEvent"><rect codeLine="30" fill="#F1F1F1" height="131.6563" id="SystemEvent" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="586" x="1075" y="96.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="82" x="1327" y="116.1426">SystemEvent</text><line style="stroke:#181818;stroke-width:0.5;" x1="1076" x2="1660" y1="124.2188" y2="124.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="154" x="1081" y="142.752">-type: SystemEventType</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="107" x="1081" y="160.3613">-message: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112" x="1081" y="177.9707">-recipient: Person</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="97" x="1081" y="195.5801">-source: Object</text><line style="stroke:#181818;stroke-width:1.0;" x1="1076" x2="1660" y1="202.6563" y2="202.6563"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="574" x="1081" y="221.1895">+SystemEvent(type: SystemEventType, message: String, recipient: Person, source: Object)</text></g><!--class SystemEventType--><g id="elem_SystemEventType"><rect codeLine="38" fill="#F1F1F1" height="27.6094" id="SystemEventType" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="120" x="417" y="148.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="114" x="420" y="168.1426">SystemEventType</text></g><!--class Person--><g id="elem_Person"><rect codeLine="42" fill="#F1F1F1" height="27.6094" id="Person" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="51" x="1717.5" y="338.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="45" x="1720.5" y="358.1426">Person</text></g><g id="elem_N1"><path d="M6,116.6094 L6,208.3672 L382,208.3672 L382,126.6094 L372,116.6094 L6,116.6094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M372,116.6094 L372,126.6094 L382,126.6094 L372,116.6094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="162" x="12" y="135.1045">SINGLETON + OBSERVER</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="165" x="174" y="135.1045">: one EventBus for the whole</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323" x="12" y="151.4561">system (getInstance, double-checked locking). Modules</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="355" x="12" y="167.8076">publish SystemEvents; SystemObservers subscribe per type.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="264" x="12" y="184.1592">Lecture names: subscribe = registerObserver,</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336" x="12" y="200.5107">unsubscribe = removeObserver, publish = notifyObservers.</text></g><!--link EventBus to SystemObserver--><g id="link_EventBus_SystemObserver"><path codeLine="45" d="M806,243.6094 C806,269.7994 806,291.4594 806,312.2394 " fill="none" id="EventBus-to-SystemObserver" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="806,318.2394,810,309.2394,806,313.2394,802,309.2394,806,318.2394" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="67" x="807" y="283.1045">subscribers</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5" x="800.5234" y="307.6614">*</text></g><!--link SystemEvent to Person--><g id="link_SystemEvent_Person"><path codeLine="46" d="M1548,228.7794 C1591.56,247.5394 1637.05,269.7494 1677,294.6094 C1697.31,307.2494 1713.4255,321.7787 1726.0555,334.2787 " fill="none" id="SystemEvent-to-Person" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1730.32,338.4994,1726.737,329.3254,1726.7662,334.9822,1721.1094,335.0114,1730.32,338.4994" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="49" x="1662" y="283.1045">recipient</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7" x="1717.1514" y="327.7065">1</text></g><!--SRC=[hLLXRzis4FskNt5mFyHURIV541HmN0FDQXSPqcIeYtsdgBFCHI85ahBX1lxlUwGaHywsOX-A88PDthsxz_XulA2LAJAsP6m-rKPNrcoKdqfZUMfIntR7TaQCpmF9GZX7IfFVAaULa4yYPzehloNb7PLSfcpTDBcWpwpP2iyPRQmf4S_qkzW9SgQsacyQ97RDhi6sxU0S2SlajcQlAJsG5YMJqSKXe7woOgzqJhOksCsGOLcZhaZDZabkLP5XWOQMHQ6-2w-CfesnQDYptGZ9RanvREnik-rbT8CAeH8vRslfQuHHeVIJew7Iw51veIMJq22bkCW8QKQg20HaRI20tvfiWhxGDMhIHGtW2p2oPjyKwESqrPHsAkCeKIl1cBn16V129qB6Hj5dM4I81x0EtBsIgXBQazd4xD9aq2KKOLsNbvPnXcsh3fp4WP1hLLfxTWrN3lnGDgglR01gnRYX-Ln2HuGk5asVGIg8w8rLZ3DsJqf7eatAnmxwJXgzLj-PhdeXBR6rFnHCQ0nAvWNt0hJ9s755lrxt5gs0-5YylZgBz7mBkDoQMcU_cG9jlLcjLf-MxvDj458gAu4TltDP-KFdoyGhZ_B1sNH9dRU9Xe-tw-NNFvTVHuatLP0vDTx3bvaAhKBz9EcyFlZ1BHdWS0a-ONgpNAxUBvVqdD2B-MXzS9xBnwxkVDvzXS8XakZjStVaHsY-tC7TGmwVipOvBercj3CgGyOH_ysTZ1ktjGFgMWLjlT60nQyw_GiaJYKcpt02d7CClek6dfsIcm1NfqxYBA7OZBw8Qjuh_UrGmPttoldvEPl5eacUD3nE64EFZBFk6uYNoNAEyy8DABN-EJXLdHRARV-dbBtjJhD_BTvibUmSZ85T-5_dpI9ieoeLY_q16M6WHjau_6Rq68_aJB0UzdzHVLLfJF-eCgRp2gEMLnW7h_4YjMDo_A6pCL6uYBQE8_eA5-qw_CNapggjR2tHOvASl3YPB6Zmo-2ryMVKirZIbpicl1kqM0WyKKoISEz39m_lK7kUBjPt3v_lbzyU7-WjTHTuVfakPd6kdNe8KoiCn_tM5E78N2n7mvpzNNi1nfGPE8GdSilo2KzMOIJ6JJwQqfSuKiF5Q3tKbn53yfoPUo4MPseuo2boxpcy9XpVCjTZJnz0CCTbOjj1Z17UitsCAF6wdVPFZNm8ar1j3gVYquJnCWMP_WO0]--></g></svg>