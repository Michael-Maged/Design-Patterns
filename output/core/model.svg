<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="365px" preserveAspectRatio="none" style="width:1369px;height:365px;background:#FFFFFF;" version="1.1" viewBox="0 0 1369 365" width="1369px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="316" x="519.5" y="24.5332">core / model  (MVC Model (service and data))</text><!--cluster here--><g id="cluster_here"><rect fill="#F3EEF8" height="314" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="992" x="7" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="176" x="415" y="62.1426">org.nonprofit.core.model</text></g><!--class Audience--><g id="elem_Audience"><rect codeLine="19" fill="#F1F1F1" height="53.2188" id="Audience" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="265" x="23.5" y="147.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="59" x="126.5" y="166.6426">Audience</text><line style="stroke:#181818;stroke-width:0.5;" x1="24.5" x2="287.5" y1="174.7188" y2="174.7188"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="253" x="29.5" y="193.252">+getAudience(): List&lt;? extends Person&gt;</text></g><!--class Person--><g id="elem_Person"><rect codeLine="22" fill="#F1F1F1" height="184.4844" id="Person" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="659" x="323.5" y="81.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="45" x="630.5" y="101.1426">Person</text><line style="stroke:#181818;stroke-width:0.5;" x1="324.5" x2="981.5" y1="109.2188" y2="109.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="61" x="329.5" y="127.752">-id: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="85" x="329.5" y="145.3613">-name: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83" x="329.5" y="162.9707">-email: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="90" x="329.5" y="180.5801">-phone: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="240" x="329.5" y="198.1895">-preferredContact: ContactPreference</text><line style="stroke:#181818;stroke-width:1.0;" x1="324.5" x2="981.5" y1="205.2656" y2="205.2656"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="629" x="329.5" y="223.7988">#Person(id: String, name: String, email: String, phone: String, preferredContact: ContactPreference)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" text-decoration="underline" textLength="224" x="329.5" y="241.4082">#requireName(name: String): String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="647" x="329.5" y="259.0176">+updateContact(name: String, email: String, phone: String, preferredContact: ContactPreference): void</text></g><!--class ContactPreference--><g id="elem_ContactPreference"><rect codeLine="33" fill="#F1F1F1" height="27.6094" id="ContactPreference" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="125" x="93.5" y="315.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="119" x="96.5" y="335.1426">ContactPreference</text></g><g id="elem_N1"><path d="M1018,136.1094 L1018,211.5156 L1362,211.5156 L1362,146.1094 L1352,136.1094 L1018,136.1094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M1352,136.1094 L1352,146.1094 L1362,146.1094 L1352,136.1094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="312" x="1024" y="154.6045">Shared people model. Donor, Volunteer, Attendee and</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="323" x="1024" y="170.9561">Beneficiary extend Person. An Audience is any group of</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314" x="1024" y="187.3076">people (e.g. an event's attendees) that Communication</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302" x="1024" y="203.6592">can reach without importing the module that owns it.</text></g><!--SRC=[hLN1RXj73BtlLn39GIj4tYG8WXIouSA9hQ954WGmaFjebj8El3lSpd3bA8R-lMzcLx3KekYb1q6Z6PBlaNoaPhIIjkP04hQL5zy7sJYjh0IkEgcvNHBlEEp9jYP6SfwqSP5wOn_CbkdHQKDE8tNShJd4gfZHR-mv6EMQDa4ws3FzONQ6eWp1ykKOYUFuAdWEnt2HJ62AZJnwMk_9cuv9VBjFKM-3UNH-Is5eEIxX4TW3rwnbnsGRrzQue3AmQTrFequyRII0i7BO6CjnGTjCxEnvuZA_1492egXXi3h0Z5hd7oALpeEXK-Cja_58od5R4zp4kXm8aRsW0Df8VG5UO0rCcWq8F4D6GHv7W5EV4Stvw6hE9PfAi20Lm20lC34s4mNFT0aJHM2VSbTdNM-yacooDrg5kYGGzaFtEZ0QE56DoCdi2Rx1hGVbEERAAJ_0vkgxa09DnRYagokBEiBq-dhacKg58ge4n-XnV70-9pgwt1n3_sx5txkVJ6zEJAR4xdNVCe4OAhbj-SJ0GsQHUtht_kGo61GVb-_Vd5agVqIuRP31rv-a1QsNgzNgzkv3qQH2MXSiOkSpTxtkZxeir2dWawpfDMLX4vLVld-YB_bSHWuxDtMuDchcyqAbJtLVYog4Mhl47UqeYgFuN_pRpBn0gmcgOR1xTtUt-eMU2dgM8jqCjUEaftHDzEhfsEq3DAh7rtA-fCykwjMln3-KFJhv3Qc8luRN0P-ZrpIRu-CKyyBLIxf7N_ns_9s6wVo6E-FQywk-WJ3-TXLumo4mokqLO4kQ3j_oGo8w6bxahvSZY_8PVa6dq0iwWrtG6IH-_ZVSV0HwWgmn1WTewiy1pVaAbF8KQdwMoAkXHrzvYbR-tvoMj1DNJur9C_XFczoPGt4eYY89EMdawrjStJVOPJKcKVgMHsrMT2jUmeA-Ipj0DemZfWmQu2nHU7t4CjjW2nZivb4Uam0gkl7F2iEkDdvFQM9wp3WS9voIgssLDWtMkzTPJ0iYnuzpR1IZuDzrWtSsxoluMTXYAzWcBtqPb5pN2pOHblBp2XfziS3nNw5LaMYbPFy2]--></g></svg>