></g><!--class DonationService--><g id="elem_DonationService"><rect codeLine="49" fill="#F1F1F1" height="42.7031" id="DonationService" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110" x="615" y="443.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="47" x="646.5" y="460.5664">&#171;Model&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104" x="618" y="477.7363">DonationService</text></g><!--class EventService--><g id="elem_EventService"><rect codeLine="52" fill="#F1F1F1" height="42.7031" id="EventService" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="89" x="821.5" y="443.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="47" x="842.5" y="460.5664">&#171;Model&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="83" x="824.5" y="477.7363">EventService</text></g><!--class VolunteerService--><g id="elem_VolunteerService"><rect codeLine="55" fill="#F1F1F1" height="57.7969" id="VolunteerService" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="114" x="1046" y="435.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="47" x="1079.5" y="453.0664">&#171;Model&#187;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="56" x="1075" y="468.1602">&#171;Context&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="108" x="1049" y="485.3301">VolunteerService</text></g><g id="elem_N1"><path d="M29.5,170.1094 L29.5,245.5156 L430.5,245.5156 L430.5,180.1094 L420.5,170.1094 L29.5,170.1094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M420.5,170.1094 L420.5,180.1094 L430.5,180.1094 L420.5,170.1094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="75" x="35.5" y="188.6045">SINGLETON</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="246" x="110.5" y="188.6045">: DataStore (lazy, double-checked locking)</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="336" x="35.5" y="204.9561">owns exactly one of each module service, so every screen</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="380" x="35.5" y="221.3076">shares the same data and every EventBus message is sent once.</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="347" x="35.5" y="237.6592">It also gives Communication look-ups that return core types.</text></g><!--link DataStore to BeneficiaryService--><g id="link_DataStore_BeneficiaryService"><path codeLine="58" d="M498.44,333.6494 C481.87,342.6694 464.92,350.8494 448,357.6094 C428.32,365.4694 421.35,359.6994 401,365.6094 C338.61,383.7294 275.8562,410.9389 229.2762,432.9189 " fill="none" id="DataStore-to-BeneficiaryService" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="223.85,435.4794,233.6963,435.2561,228.3718,433.3456,230.2823,428.0211,223.85,435.4794" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="104" x="402" y="380.1045">beneficiaryService</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7" x="228.5203" y="424.913">1</text></g><!--link DataStore to CommunicationService--><g id="link_DataStore_CommunicationService"><path codeLine="59" d="M558.34,333.6494 C548.74,344.4494 539.19,355.2194 530,365.6094 C509.3,389.0094 489.8822