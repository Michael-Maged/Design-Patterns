" x="2098.5" y="372.3457">#createDonation(id: String, donor: Donor, date: LocalDate, form: DonationForm): Donation</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="167" x="2098.5" y="389.9551">+getType(): DonationType</text></g><g id="elem_N1"><path d="M6,96.1094 L6,171.5156 L341,171.5156 L341,106.1094 L331,96.1094 L6,96.1094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M331,96.1094 L331,106.1094 L341,106.1094 L331,96.1094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" font-weight="bold" lengthAdjust="spacing" textLength="120" x="12" y="114.6045">FACTORY METHOD</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="153" x="132" y="114.6045">: receive() is final and calls</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="302" x="12" y="130.9561">createDonation() (the factory method), then adds the</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="314" x="12" y="147.3076">donation to the donor. Each ConcreteCreator builds its</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="306" x="12" y="163.6592">own ConcreteProduct (constructors package-private).</text></g><!--reverse link Donation to CheckDonation--><g id="link_Donation_CheckDonation"><path codeLine="74" d="M1602.7618,479.0155 C1564.4818,495.9055 1540.73,503.9094 1501.5,514.6094 C1373.28,549.5994 1335.31,522.5494 1203.5,539.6094 C1190.69,541.2694 1177.66,543.0494 1164.52,544.9194 " fill="none" id="Donation-backto-CheckDonation" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="none" points="1619.23,471.7494,1600.3397,473.5261,1605.1838,484.5049,1619.23,471.7494" style="stroke:#181818;stroke-width:1.0;"/></g><!--reverse link DonationCreator to CheckDonationCreat