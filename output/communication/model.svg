<?xml version="1.0" encoding="us-ascii" standalone="no"?><svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" contentStyleType="text/css" height="708px" preserveAspectRatio="none" style="width:1830px;height:708px;background:#FFFFFF;" version="1.1" viewBox="0 0 1830 708" width="1830px" zoomAndPan="magnify"><defs/><g><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="390" x="713" y="24.5332">communication / model  (MVC Model (service and data))</text><!--cluster here--><g id="cluster_here"><rect fill="#F3EEF8" height="520" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="1273" x="31" y="182.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="250" x="542.5" y="199.1426">org.nonprofit.communication.model</text></g><!--cluster other0--><g id="cluster_other0"><rect fill="#F5F5F5" height="95" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="280" x="1328" y="563.1094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="264" x="1336" y="579.6426">org.nonprofit.communication.strategy</text></g><!--cluster other1--><g id="cluster_other1"><rect fill="#F5F5F5" height="80" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="192" x="1632" y="570.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="176" x="1640" y="587.1426">org.nonprofit.core.model</text></g><!--cluster other2--><g id="cluster_other2"><rect fill="#F5F5F5" height="95" rx="2.5" ry="2.5" style="stroke:#000000;stroke-width:1.5;" width="214" x="390" y="45.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-weight="bold" lengthAdjust="spacing" textLength="198" x="398" y="62.1426">org.nonprofit.core.observer</text></g><!--class CommunicationService--><g id="elem_CommunicationService"><rect codeLine="19" fill="#F1F1F1" height="267.5" id="CommunicationService" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="829" x="47.5" y="218.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="47" x="438.5" y="236.0664">&#171;Model&#187;</text><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="115" x="404.5" y="251.1602">&#171;ConcreteObserver&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="144" x="390" y="268.3301">CommunicationService</text><line style="stroke:#181818;stroke-width:0.5;" x1="48.5" x2="875.5" y1="276.4063" y2="276.4063"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="128" x="53.5" y="294.9395">-organisation: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="168" x="53.5" y="312.5488">-selector: ChannelSelector</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="156" x="53.5" y="330.1582">-log: List&lt;SentMessage&gt;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="130" x="53.5" y="347.7676">-outbox: List&lt;String&gt;</text><line style="stroke:#181818;stroke-width:1.0;" x1="48.5" x2="875.5" y1="354.8438" y2="354.8438"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="285" x="53.5" y="373.377">+CommunicationService(organisation: String)</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="229" x="53.5" y="390.9863">+onEvent(event: SystemEvent): void</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="642" x="53.5" y="408.5957">+broadcast(recipients: Collection&lt;? extends Person&gt;, subject: String, text: String, urgent: boolean): int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="817" x="53.5" y="426.2051">+broadcast(recipients: Collection&lt;? extends Person&gt;, subject: String, text: String, urgent: boolean, forced: ContactPreference): int</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="671" x="53.5" y="443.8145">+send(recipient: Person, subject: String, text: String, urgent: boolean, forced: ContactPreference): boolean</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="511" x="53.5" y="461.4238">~compose(text: String, urgent: boolean, channel: CommunicationChannel): String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="171" x="53.5" y="479.0332">+takeOutput(): List&lt;String&gt;</text></g><!--class Message--><g id="elem_Message"><rect codeLine="33" fill="#F1F1F1" height="114.0469" id="Message" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="376" x="912" y="295.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="57" x="1071.5" y="315.1426">Message</text><line style="stroke:#181818;stroke-width:0.5;" x1="913" x2="1287" y1="323.2188" y2="323.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="112" x="918" y="341.752">-recipient: Person</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95" x="918" y="359.3613">-subject: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="81" x="918" y="376.9707">-body: String</text><line style="stroke:#181818;stroke-width:1.0;" x1="913" x2="1287" y1="384.0469" y2="384.0469"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="364" x="918" y="402.5801">+Message(recipient: Person, subject: String, body: String)</text></g><!--class SentMessage--><g id="elem_SentMessage"><rect codeLine="40" fill="#F1F1F1" height="131.6563" id="SentMessage" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="553" x="185.5" y="554.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="86" x="419" y="574.1426">SentMessage</text><line style="stroke:#181818;stroke-width:0.5;" x1="186.5" x2="737.5" y1="582.2188" y2="582.2188"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="134" x="191.5" y="600.752">-time: LocalDateTime</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="100" x="191.5" y="618.3613">-channel: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="104" x="191.5" y="635.9707">-recipient: String</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="95" x="191.5" y="653.5801">-subject: String</text><line style="stroke:#181818;stroke-width:1.0;" x1="186.5" x2="737.5" y1="660.6563" y2="660.6563"/><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="541" x="191.5" y="679.1895">+SentMessage(time: LocalDateTime, channel: String, recipient: String, subject: String)</text></g><!--class ChannelSelector--><g id="elem_ChannelSelector"><rect codeLine="50" fill="#F1F1F1" height="42.7031" id="ChannelSelector" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="111" x="1344.5" y="599.1094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="56" x="1372" y="616.5664">&#171;Context&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" lengthAdjust="spacing" textLength="105" x="1347.5" y="633.7363">ChannelSelector</text></g><!--class Person--><g id="elem_Person"><rect codeLine="53" fill="#F1F1F1" height="27.6094" id="Person" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="51" x="1648.5" y="606.6094"/><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="45" x="1651.5" y="626.1426">Person</text></g><!--class SystemObserver--><g id="elem_SystemObserver"><rect codeLine="56" fill="#F1F1F1" height="42.7031" id="SystemObserver" rx="2.5" ry="2.5" style="stroke:#181818;stroke-width:0.5;" width="110" x="407" y="81.6094"/><text fill="#000000" font-family="sans-serif" font-size="12" font-style="italic" lengthAdjust="spacing" textLength="65" x="429.5" y="99.0664">&#171;Observer&#187;</text><text fill="#000000" font-family="sans-serif" font-size="14" font-style="italic" lengthAdjust="spacing" textLength="104" x="410" y="116.2363">SystemObserver</text></g><g id="elem_N1"><path d="M6,65.6094 L6,141.0156 L372,141.0156 L372,75.6094 L362,65.6094 L6,65.6094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:0.5;"/><path d="M362,65.6094 L362,75.6094 L372,75.6094 L362,65.6094 " fill="#FFFDE7" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="339" x="12" y="84.1045">CommunicationService is a SystemObserver: it subscribes</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="324" x="12" y="100.4561">to every EventBus topic and sends to the recipient, or to</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="345" x="12" y="116.8076">the source Audience when there is none. Nothing is printed:</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="311" x="12" y="133.1592">text goes to an outbox that a view reads (takeOutput).</text></g><!--reverse link SystemObserver to CommunicationService--><g id="link_SystemObserver_CommunicationService"><path codeLine="59" d="M462,142.7894 C462,164.2794 462,181.8494 462,218.5294 " fill="none" id="SystemObserver-backto-CommunicationService" style="stroke:#181818;stroke-width:1.0;stroke-dasharray:7.0,7.0;"/><polygon fill="none" points="462,124.7894,456,142.7894,468,142.7894,462,124.7894" style="stroke:#181818;stroke-width:1.0;"/></g><!--link CommunicationService to ChannelSelector--><g id="link_CommunicationService_ChannelSelector"><path codeLine="60" d="M876.52,482.1694 C882.71,483.6794 888.88,485.1694 895,486.6094 C1074.36,528.8694 1132.87,486.2694 1304,554.6094 C1330.73,565.2894 1352.8579,580.5799 1371.3279,595.2999 " fill="none" id="CommunicationService-to-ChannelSelector" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="1376.02,599.0394,1371.4748,590.302,1372.1099,595.9231,1366.4888,596.5582,1376.02,599.0394" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="46" x="1230" y="526.1045">selector</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="7" x="1361.2913" y="588.3091">1</text></g><!--link CommunicationService to SentMessage--><g id="link_CommunicationService_SentMessage"><path codeLine="61" d="M462,486.9994 C462,510.4594 462,527.9094 462,548.4194 " fill="none" id="CommunicationService-to-SentMessage" style="stroke:#181818;stroke-width:1.0;"/><polygon fill="#181818" points="462,554.4194,466,545.4194,462,549.4194,458,545.4194,462,554.4194" style="stroke:#181818;stroke-width:1.0;"/><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="17" x="463" y="526.1045">log</text><text fill="#000000" font-family="sans-serif" font-size="13" lengthAdjust="spacing" textLength="5" x="456.7266" y="543.838">*</text></g><!--link Message to Person--><g id="link_Message_Person"><path codeLine="62" d="M1221.03,409.6994 C1